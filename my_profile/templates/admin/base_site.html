{% extends "admin/base.html" %}

{% block title %}{{ title }} | Portfolio Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}">
    <span style="color:#a78bfa">⚡</span> Trikon Studio
  </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* ── CSS variables ─────────────────────── */
  :root {
    --bg:        #0f0f1a;
    --surface:   #1a1a2e;
    --surface2:  #16213e;
    --border:    #2a2a4a;
    --accent:    #a78bfa;
    --accent2:   #7c3aed;
    --text:      #e2e8f0;
    --muted:     #94a3b8;
    --success:   #10b981;
    --warning:   #f59e0b;
    --danger:    #ef4444;
    --radius:    10px;
  }

  /* ── Base ──────────────────────────────── */
  body { background: var(--bg) !important; color: var(--text) !important; font-family: 'Segoe UI', system-ui, sans-serif; }
  a    { color: var(--accent) !important; }
  a:hover { color: #c4b5fd !important; text-decoration: underline; }

  /* ── Header / Nav ──────────────────────── */
  #header {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%) !important;
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    box-shadow: 0 2px 20px rgba(124,58,237,.3);
  }
  #site-name a { color: #fff !important; font-size: 1.25rem; font-weight: 700; letter-spacing: -.3px; text-decoration: none !important; }
  #user-tools   { color: var(--muted) !important; font-size: .85rem; }
  #user-tools a { color: #c4b5fd !important; }

  /* ── Breadcrumbs ───────────────────────── */
  .breadcrumbs {
    background: var(--surface2) !important;
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    font-size: .85rem;
  }
  .breadcrumbs a { color: var(--accent) !important; }

  /* ── Sidebar nav ───────────────────────── */
  #nav-sidebar { background: var(--surface) !important; border-right: 1px solid var(--border); }
  .sidebar-title, #nav-sidebar .current-app .section { color: var(--accent) !important; font-weight: 700; }
  .nav-sidebar .module th, .nav-sidebar caption { background: var(--surface2) !important; color: var(--muted) !important; }
  .nav-sidebar a, .nav-sidebar .section { color: var(--text) !important; }
  .nav-sidebar a:hover { background: rgba(167,139,250,.12) !important; color: var(--accent) !important; }

  /* ── Main content ──────────────────────── */
  #content, #content-main { background: var(--bg) !important; }
  #content-related        { background: var(--surface) !important; border-left: 1px solid var(--border); }

  /* ── Modules / cards ───────────────────── */
  .module {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: var(--radius) !important;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
    margin-bottom: 20px;
  }
  .module caption, .module h2, .module > h2 {
    background: linear-gradient(135deg, var(--surface2), #1a1a3e) !important;
    color: var(--accent) !important;
    border-radius: var(--radius) var(--radius) 0 0 !important;
    padding: 12px 16px !important;
    font-size: .95rem !important;
    font-weight: 700;
    border-bottom: 1px solid var(--border) !important;
  }

  /* ── Tables ─────────────────────────────── */
  #result_list, .results table { border-radius: var(--radius); overflow: hidden; }
  #result_list thead th, #result_list thead td {
    background: var(--surface2) !important;
    color: var(--muted) !important;
    border-bottom: 1px solid var(--border) !important;
    font-weight: 600;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  #result_list tbody tr { background: var(--surface) !important; border-bottom: 1px solid var(--border) !important; transition: background .15s; }
  #result_list tbody tr:hover { background: rgba(167,139,250,.08) !important; }
  #result_list tbody td, #result_list tbody th { color: var(--text) !important; border: none !important; }

  /* ── Filters ─────────────────────────────── */
  #changelist-filter { background: var(--surface) !important; border-left: 1px solid var(--border); }
  #changelist-filter h2 { background: var(--surface2) !important; color: var(--accent) !important; border-radius: var(--radius) var(--radius) 0 0 !important; padding: 10px 14px !important; font-size: .85rem; }
  #changelist-filter h3 { color: var(--muted) !important; font-size: .78rem; }
  #changelist-filter li.selected a, #changelist-filter li a:hover { color: var(--accent) !important; }
  #changelist-filter a { color: var(--text) !important; }

  /* ── Search bar ─────────────────────────── */
  #toolbar { background: var(--surface2) !important; border-bottom: 1px solid var(--border) !important; padding: 12px 16px; }
  #searchbar { background: var(--bg) !important; border: 1px solid var(--border) !important; color: var(--text) !important; border-radius: 6px; padding: 6px 10px; }
  #searchbar:focus { border-color: var(--accent) !important; outline: 2px solid rgba(167,139,250,.3); }

  /* ── Buttons ─────────────────────────────── */
  .button, input[type=submit], .submit-row input, a.button {
    background: linear-gradient(135deg, var(--accent2), var(--accent)) !important;
    color: #fff !important;
    border: none !important;
    border-radius: 6px !important;
    padding: 7px 18px !important;
    font-weight: 600 !important;
    cursor: pointer;
    transition: opacity .15s;
  }
  .button:hover, input[type=submit]:hover { opacity: .9; }
  .button.default { background: linear-gradient(135deg, #059669, #10b981) !important; }
  a.deletelink { background: var(--danger) !important; }

  /* ── Forms ───────────────────────────────── */
  .form-row { border-bottom: 1px solid var(--border) !important; }
  input[type=text], input[type=email], input[type=password], input[type=url],
  input[type=number], textarea, select {
    background: var(--bg) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
    border-radius: 6px !important;
    padding: 6px 10px !important;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent) !important;
    outline: 2px solid rgba(167,139,250,.3) !important;
  }
  .fieldBox label, .form-row label { color: var(--muted) !important; }

  /* ── Messages / alerts ───────────────────── */
  .messagelist .success { background: rgba(16,185,129,.15) !important; border-left: 4px solid var(--success) !important; color: #6ee7b7 !important; }
  .messagelist .warning { background: rgba(245,158,11,.15) !important; border-left: 4px solid var(--warning) !important; color: #fcd34d !important; }
  .messagelist .error   { background: rgba(239,68,68,.15)  !important; border-left: 4px solid var(--danger)  !important; color: #fca5a5 !important; }

  /* ── Paginator ───────────────────────────── */
  .paginator { color: var(--muted) !important; }
  .paginator a { color: var(--accent) !important; }

  /* ── Submit row ──────────────────────────── */
  .submit-row { background: var(--surface2) !important; border-top: 1px solid var(--border) !important; padding: 12px 16px !important; }

  /* ── Inline ──────────────────────────────── */
  .inline-group { border: 1px solid var(--border) !important; border-radius: var(--radius) !important; }
  .inline-group h2 { color: var(--accent) !important; background: var(--surface2) !important; }

  /* ── Date hierarchy ──────────────────────── */
  #changelist-filter ul li a, #changelist .toplinks a { color: var(--accent) !important; }

  /* ── Footer ──────────────────────────────── */
  #footer { color: var(--muted) !important; font-size: .75rem; border-top: 1px solid var(--border); padding: 12px 20px; }

  /* ── Scrollbars ──────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }
</style>
{% endblock %}
