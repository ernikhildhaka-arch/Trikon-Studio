<article class="card case">
{% if p.video %}
<video class="thumb" controls playsinline preload="metadata">
  <source src="{{ p.video.url }}">
  Your browser does not support the video tag.
</video>
{% endif %}
<span class="meta">{{ p.year }} · {{ p.get_category_display }}</span>
<h3>{{ p.title }}</h3>
<p>{{ p.summary|linebreaksbr }}</p>
{% if p.link %}<a class="more" href="{{ p.link }}" target="_blank" rel="noreferrer">View project</a>{% endif %}
</article>
